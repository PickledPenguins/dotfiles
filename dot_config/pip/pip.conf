# ~/.config/pip/pip.conf: pip defaults. `pip config list` prints what
# applies.
#
# Each setting has its description in the comment above it. A setting with
# "#" directly in front of it is off: delete that "#" to turn it on, or add
# one to turn a setting off. `dots options WORD` searches every file.

[global]
# Give up on an unresponsive index after 60 s (default 15).
timeout = 60

# pip refuses to install outside a virtual environment, so nothing lands
# in the system or user site by mistake. A conda environment does not
# count: pip refuses there too. Once: PIP_REQUIRE_VIRTUALENV=0 pip install
#require-virtualenv = true

# No "A new release of pip is available" notice.
#disable-pip-version-check = true

# Packages from a site mirror instead of PyPI.
#index-url = https://pypi.example.org/simple

# A second index searched as well as PyPI (a private one).
#extra-index-url = https://pypi.example.org/simple

# Trust this host's certificate for the mirror above (self-signed).
#trusted-host = pypi.example.org

# No download cache in ~/.cache/pip (small $HOME quotas).
#no-cache-dir = true

[install]
# --user by default. It applies inside a virtual environment too, where
# pip then refuses every install ("User site-packages are not visible in
# this virtualenv"); not with conda.
#user = true
