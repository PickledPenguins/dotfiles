# ~/.config/kitty/kitty.conf: the kitty terminal. Every setting here is
# off but the last, so kitty behaves as it does without a config file until
# you choose.
# kitty re-reads this file on ctrl+shift+f5; `kitty +runpy 'from kitty.config
# import *; print(commented_out_default_config())'` prints every option.
#
# Each setting has its description in the comment above it. A setting with
# "#" directly in front of it is off: delete that "#" to turn it on, or add
# one to turn a setting off. `dots options WORD` searches every file.
# For one machine only, put the line in ~/.config/kitty/local.conf instead.

# ── Fonts ─────────────────────────────────────────────────────────────────

# The font, by family name (`kitty +list-fonts` lists them); bold and italic
# come from the same family.
#font_family JetBrains Mono

# Font size in points (default 11). ctrl+shift+equal and ctrl+shift+minus
# change it for the running window.
#font_size 12.0

# Programming ligatures (-> as one arrow) are drawn as separate letters
# under the cursor, so you can see what you are editing.
#disable_ligatures cursor

# Line height as a percentage of the font's (more space between lines).
#modify_font cell_height 110%

# ── Scrollback ────────────────────────────────────────────────────────────

# Lines of scrollback per window (default 2000).
#scrollback_lines 20000

# ctrl+shift+h opens the whole scrollback in less, with colors.
#scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# The mouse wheel scrolls this many lines per notch (default 5).
#wheel_scroll_multiplier 3.0

# ── Mouse and clipboard ───────────────────────────────────────────────────

# Selecting with the mouse copies to the clipboard as well as the selection.
#copy_on_select clipboard

# Trailing spaces are removed from copied text of plain lines.
#strip_trailing_spaces smart

# Hide the mouse pointer after 3 s of typing.
#mouse_hide_wait 3.0

# Programs in kitty may read and set the clipboard (OSC 52), which tmux's
# set-clipboard and vim over ssh use; ask first for reads.
#clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# ── Cursor ────────────────────────────────────────────────────────────────

# A steady cursor instead of a blinking one.
#cursor_blink_interval 0

# The cursor shape when programs do not set one: block, beam or underline.
#cursor_shape beam

# A short trail follows the cursor when it jumps, so the eye finds it.
#cursor_trail 3

# ── Bell ──────────────────────────────────────────────────────────────────

# No audible bell.
#enable_audio_bell no

# A brief flash for the bell instead.
#visual_bell_duration 0.1

# ── Windows and tabs ──────────────────────────────────────────────────────

# Closing the OS window never asks for confirmation.
#confirm_os_window_close 0

# Space between the text and the window edge, in points.
#window_padding_width 4

# No title bar or frame from the window manager.
#hide_window_decorations yes

# New windows open at 120x36 cells instead of the last size used.
#remember_window_size no
#initial_window_width 120c
#initial_window_height 36c

# Tabs drawn as powerline-style shapes at the top of the window.
#tab_bar_edge top
#tab_bar_style powerline

# The layouts ctrl+shift+l cycles through: all, or only these.
#enabled_layouts tall,stack,grid

# A slightly see-through background (needs a compositor); ctrl+shift+a then
# m and l change it.
#background_opacity 0.95
#dynamic_background_opacity yes

# ── Colors ────────────────────────────────────────────────────────────────

# A color theme from a file: `kitty +kitten themes` picks one and writes it.
# Needs: ~/.config/kitty/current-theme.conf
#include current-theme.conf

# ── Terminal and ssh ──────────────────────────────────────────────────────

# TERM=xterm-256color instead of xterm-kitty: remote hosts without kitty's
# terminfo then work without `kitten ssh`. Loses kitty-only features in
# programs that read the terminfo.
#term xterm-256color

# Shell integration (jump between prompts with ctrl+shift+z / x, open the
# last command's output with ctrl+shift+g) without the cursor-shape part,
# which vim and the prompt set themselves.
#shell_integration no-cursor

# Other programs (kitty @, kittens, scripts) may control kitty through a
# socket. Anything running as you can then type into any window.
#allow_remote_control socket-only
#listen_on unix:/tmp/kitty

# ── Keys ──────────────────────────────────────────────────────────────────

# ctrl+shift+enter opens a new window in the current window's directory.
#map ctrl+shift+enter launch --cwd=current

# ctrl+shift+t opens a new tab in the current window's directory.
#map ctrl+shift+t launch --cwd=current --type=tab

# ctrl+c copies when text is selected and sends Ctrl-C otherwise;
# ctrl+v pastes.
#map ctrl+c copy_or_interrupt
#map ctrl+v paste_from_clipboard

# ctrl+shift+u types a Unicode character by name.
#map ctrl+shift+u kitten unicode_input

# ── Per machine ───────────────────────────────────────────────────────────

# This machine's settings, read when ~/.config/kitty/local.conf exists.
globinclude local.conf
