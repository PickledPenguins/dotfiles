# 00-options.conf -- server and session options.

# ── terminal ──────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"            # colors + italics inside tmux
set -ga terminal-overrides ",xterm-256color:Tc"    # true color when the outer terminal has it
set -ga terminal-overrides ",*:Ss=\E[%p1%d q:Se=\E[2 q"   # cursor shape escapes pass through (vim)
set -g focus-events on                             # vim's autoread and FocusGained work
set -s escape-time 0                               # no delay after Esc (vim mode switches)
set -s set-clipboard on                            # copy reaches the outer terminal's clipboard (OSC 52)

# ── behavior ──────────────────────────────────────────────────────────────
set -g history-limit 50000                         # scrollback lines per pane
set -g mouse on                                    # click panes, drag to resize, wheel scrolls
set -g base-index 1                                # windows number from 1 (0 is far from 1 on the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on                         # closing a window closes the numbering gap
setw -g mode-keys vi                               # vi keys in copy mode
set -g status-keys emacs                           # emacs keys on the command prompt
set -g display-time 2000                           # messages stay 2 s
set -g display-panes-time 2000                     # prefix q numbers stay 2 s
setw -g aggressive-resize on                       # size to the smallest client on THIS window only
set -g detach-on-destroy off                       # killing a session switches to another instead of detaching
set -g allow-rename off                            # programs cannot rename windows
setw -g automatic-rename on                        # ... but tmux names them after the command
set -g set-titles on                               # outer terminal title ...
set -g set-titles-string "#S:#W  #h"               # ... session:window  host
set -g monitor-activity on                         # flag windows with new output
set -g visual-activity off                         # ... without a message line
set -g bell-action any
