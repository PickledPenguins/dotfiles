# 00-options.conf -- server and session options: the terminal, scrollback,
# the mouse, numbering, names and titles.
#
# Each setting has its description in the comment above it.  A setting with
# "#" directly in front of it is off: delete that "#" to turn it on, or add
# one to turn a setting off.  `dots options WORD` searches every file.
# For one machine only, put the line in ~/.tmux.conf.local instead.

# ── Terminal ──────────────────────────────────────────────────────────────

# Programs inside tmux see TERM=tmux-256color: 256 colors and italics.
set -g default-terminal "tmux-256color"

# TERM=screen-256color inside tmux instead, for old systems (or ones you
# ssh to) whose terminfo has no tmux-256color: vim and less then complain
# about an unknown terminal.
#set -g default-terminal "screen-256color"

# 24-bit color passes through when the outer terminal has it.
set -ga terminal-overrides ",xterm-256color:Tc"

# The same for terminals whose TERM is not xterm-256color (kitty's
# xterm-kitty, alacritty, foot, wezterm), in tmux 3.2's newer spelling.
#set -as terminal-features ",xterm-kitty:RGB,alacritty:RGB,foot:RGB,wezterm:RGB"

# Cursor-shape escapes pass through, so vim's bar and block cursors work.
# Single quotes: in double quotes tmux drops the backslash of \E, and the
# outer terminal prints "E[2 q" as text.
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Programs learn when their pane gains or loses focus (vim's autoread).
set -g focus-events on

# No wait after Esc: vim switches modes at once.  Alt-key chords typed
# very slowly may then arrive as Esc and the key, and over a slow ssh link
# a terminal's reply to a query can show up as typed characters (tmux's
# own default is 10).
set -s escape-time 0

# Copying inside tmux reaches the outer terminal's clipboard (OSC 52),
# even over ssh.
set -s set-clipboard on

# Programs may send escape sequences straight to the outer terminal:
# images in kitty (icat) or sixel, and other passthrough protocols.
#set -g allow-passthrough on

# Keys such as Ctrl-Enter, Shift-Enter and Ctrl-; reach programs as
# distinct keys (CSI u), where the outer terminal sends them.
#set -s extended-keys on

# ── Scrollback and mouse ──────────────────────────────────────────────────

# 50000 lines of scrollback per pane (memory: roughly 5 MB per full pane).
set -g history-limit 50000

# The mouse clicks panes and windows, drags borders, and the wheel
# scrolls.  Selecting text for the outer terminal then needs Shift held
# (prefix m toggles the mouse, 10-keys.conf).
set -g mouse on

# ── Numbering and names ───────────────────────────────────────────────────

# Windows and panes number from 1, since 0 is far from 1 on the keyboard.
set -g base-index 1
setw -g pane-base-index 1

# Closing a window renumbers the rest, so there are no gaps.
set -g renumber-windows on

# Programs cannot rename windows with escape sequences ...
set -g allow-rename off

# ... but tmux names each window after the program running in it.
setw -g automatic-rename on

# The window name is the pane's directory instead of its program.
#setw -g automatic-rename-format "#{b:pane_current_path}"

# ── Keys in modes ─────────────────────────────────────────────────────────

# vi keys in copy mode (30-copy.conf); emacs keys at the : prompt.
setw -g mode-keys vi
set -g status-keys emacs

# vi keys at the : command prompt too.
#set -g status-keys vi

# Keys bound with -r repeat without the prefix for 600 ms (the default 500).
#set -g repeat-time 600

# ── Messages ──────────────────────────────────────────────────────────────

# Messages and pane numbers (prefix q) stay 2 seconds.
set -g display-time 2000
set -g display-panes-time 2000

# Windows with new output are flagged in the status line, without a message.
set -g monitor-activity on
set -g visual-activity off

# A bell in any window, not only the current one, is passed on.
set -g bell-action any

# ── Sessions and titles ───────────────────────────────────────────────────

# A window takes the size of the smallest client viewing that window, not
# of the smallest client of the session.
setw -g aggressive-resize on

# Killing a session moves you to another one instead of detaching.
#set -g detach-on-destroy off

# The outer terminal's title shows session:window and the host.
set -g set-titles on
set -g set-titles-string "#S:#W  #h"

# A pane stays after its program exits, showing the exit status, until
# closed with prefix x (useful for builds and tests).
#set -g remain-on-exit on

# New panes start non-login shells: faster when ~/.bash_profile is slow;
# ~/.bashrc still runs.
#set -g default-command "${SHELL}"

# Lock the session after 30 idle minutes (needs a lock program such as vlock).
#set -g lock-after-time 1800
