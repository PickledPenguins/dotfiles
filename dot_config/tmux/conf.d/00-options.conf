# Server and session options.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # true color through xterm
set -g history-limit 50000
set -g mouse on
set -s escape-time 0                # no delay after Esc (vim)
set -g focus-events on              # vim autoread works
set -g base-index 1                 # windows and panes start at 1
setw -g pane-base-index 1
set -g renumber-windows on          # close a window, the rest close the gap
setw -g mode-keys vi                # vi keys in copy mode
set -g display-time 2000            # messages stay 2 s
setw -g aggressive-resize on
