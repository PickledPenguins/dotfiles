# 30-copy.conf -- copy mode with vi keys, and the system clipboard.
#
#   prefix [    enter copy mode        prefix ]  paste
#   v           start selection        V   line selection    C-v  block
#   y           copy and leave         Y   copy to the end of the line
#   Esc         cancel
#
# Copied text goes to tmux's buffer and, through the pipe below, to the
# system clipboard: xclip or xsel on X11, wl-copy on Wayland, pbcopy on
# macOS, whichever exists.  set-clipboard (00-options.conf) covers terminals
# that understand OSC 52 without any of those (xterm only with the
# disallowedWindowOps line described in ~/.Xresources).
#
# Each setting has its description in the comment above it.  A setting with
# "#" directly in front of it is off: delete that "#" to turn it on, or add
# one to turn a setting off.  `dots options WORD` searches every file.
# For one machine only, put the line in ~/.tmux.conf.local instead.

# v, V and C-v select as in vim; Y copies to the end of the line; Esc leaves.
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Y   send -X copy-end-of-line
bind -T copy-mode-vi Escape send -X cancel

# y copies to tmux's buffer and the system clipboard, and leaves copy mode.
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel \
  "if command -v xclip >/dev/null; then xclip -in -selection clipboard; \
   elif command -v xsel >/dev/null; then xsel --clipboard --input; \
   elif command -v wl-copy >/dev/null; then wl-copy; \
   elif command -v pbcopy >/dev/null; then pbcopy; else cat >/dev/null; fi"

# Dragging with the mouse copies the same way and stays in copy mode at
# the same place.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear \
  "if command -v xclip >/dev/null; then xclip -in -selection clipboard; \
   elif command -v xsel >/dev/null; then xsel --clipboard --input; \
   elif command -v wl-copy >/dev/null; then wl-copy; \
   elif command -v pbcopy >/dev/null; then pbcopy; else cat >/dev/null; fi"

# Double-click selects a word, triple-click a line.
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line

# prefix P pastes the system clipboard (X11, xclip) instead of tmux's buffer.
bind P run "xclip -out -selection clipboard 2>/dev/null | tmux load-buffer - && tmux paste-buffer"

# H and L go to the start and end of the line in copy mode (vim's ^ and $),
# instead of the top and bottom of the screen.
#bind -T copy-mode-vi H send -X start-of-line
#bind -T copy-mode-vi L send -X end-of-line

# The mouse wheel scrolls one line at a time in copy mode instead of five.
#bind -T copy-mode-vi WheelUpPane send -N1 -X scroll-up
#bind -T copy-mode-vi WheelDownPane send -N1 -X scroll-down

# prefix Enter enters copy mode, beside the default prefix [.
#bind Enter copy-mode
