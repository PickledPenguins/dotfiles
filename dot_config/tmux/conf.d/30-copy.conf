# 30-copy.conf -- copy mode with vi keys.
#
#   prefix [    enter copy mode        prefix ]  paste
#   v           start selection        V   line selection    C-v  block
#   y           copy and leave         Y   copy the whole line
#   Esc         cancel
#
# Copied text goes to the tmux buffer and, through the pipe below, to the
# system clipboard: xclip or xsel on X11, wl-copy on Wayland, pbcopy on
# macOS -- whichever exists.  set-clipboard (00-options) covers terminals
# that speak OSC 52 even without those.

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Y   send -X copy-end-of-line
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel \
  "if command -v xclip >/dev/null; then xclip -in -selection clipboard; \
   elif command -v xsel >/dev/null; then xsel --clipboard --input; \
   elif command -v wl-copy >/dev/null; then wl-copy; \
   elif command -v pbcopy >/dev/null; then pbcopy; else cat >/dev/null; fi"

# mouse drag copies the same way, without leaving copy mode scrolled
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear \
  "if command -v xclip >/dev/null; then xclip -in -selection clipboard; \
   elif command -v xsel >/dev/null; then xsel --clipboard --input; \
   elif command -v wl-copy >/dev/null; then wl-copy; \
   elif command -v pbcopy >/dev/null; then pbcopy; else cat >/dev/null; fi"

# double / triple click select a word / a line
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line

# prefix P pastes from the system clipboard (X11) instead of the tmux buffer
bind P run "xclip -out -selection clipboard 2>/dev/null | tmux load-buffer - && tmux paste-buffer"
