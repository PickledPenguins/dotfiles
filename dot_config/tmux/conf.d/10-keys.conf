# Key bindings.  Prefix stays C-b; uncomment the next two lines for C-a.
# set -g prefix C-a
# bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# splits that keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane movement and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# copy mode: v to select, y to yank (and to the X clipboard when xclip exists)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || cat >/dev/null"

# log this pane to ~/tmux.log.<window>-<pane>
bind C-p pipe-pane -o 'cat >>~/tmux.log.#I-#P' \; display "logging toggled"
