# 10-keys.conf: key bindings.  The prefix stays C-b.  A binding here
# replaces tmux's default for that key where it had one; `prefix ?` lists
# every binding.
#
# Each setting has its description in the comment above it.  A setting with
# "#" directly in front of it is off: delete that "#" to turn it on, or add
# one to turn a setting off.  `dots options WORD` searches every file.
# For one machine only, put the line in ~/.tmux.conf.local instead.

# ── The prefix ────────────────────────────────────────────────────────────

# C-a as the prefix (the GNU screen habit); C-a C-a sends a real C-a to the
# program (bash's start of line).
#set -g prefix C-a
#unbind C-b
#bind C-a send-prefix

# C-Space as the prefix: nothing else uses it.
#set -g prefix C-Space
#unbind C-b
#bind C-Space send-prefix

# ── Configuration ─────────────────────────────────────────────────────────

# prefix r reloads the configuration (replaces refresh-client).
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Panes ─────────────────────────────────────────────────────────────────

# prefix | splits right, prefix - below (replacing delete-buffer), and
# prefix c opens a window, each in the current pane's directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"

# The default split keys " and % keep the pane's directory too.
#bind '"' split-window -v -c "#{pane_current_path}"
#bind % split-window -h -c "#{pane_current_path}"

# prefix h j k l move between panes, vim style (l replaces last-window;
# prefix Tab does that below).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# prefix H J K L resize by 5 cells, repeatable without the prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt-h j k l move between panes without the prefix.  Programs in the
# panes lose those Alt keys (bash's Alt-l lowercases a word).
#bind -n M-h select-pane -L
#bind -n M-j select-pane -D
#bind -n M-k select-pane -U
#bind -n M-l select-pane -R

# Ctrl-h j k l move between tmux panes and vim windows alike; needs the
# christoomey/vim-tmux-navigator vim plugin (60-plugins.vim).  Takes Ctrl-l
# (clear screen) from the shell: prefix C-l below clears instead.
#is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
#bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
#bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
#bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
#bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# prefix x closes the pane and prefix X the window, without asking.
bind x kill-pane
bind X kill-window

# prefix z zooms the pane to the whole window and back (the default,
# listed so it is found).
bind z resize-pane -Z

# prefix b moves the pane to a window of its own, staying here.
bind b break-pane -d

# prefix @ asks which window's pane to pull in beside this one.
bind @ command-prompt -p "join pane from:" "join-pane -h -s '%%'"

# prefix y types into every pane of the window at once, and again stops.
bind y setw synchronize-panes \; display "synchronize-panes #{?synchronize-panes,on,off}"

# ── Windows ───────────────────────────────────────────────────────────────

# prefix Tab goes to the window used before this one.
bind Tab last-window

# Alt-Left and Alt-Right switch windows without the prefix; Alt-Up and
# Alt-Down move the window left and right.
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-Up    swap-window -t -1 \; previous-window
bind -n M-Down  swap-window -t +1 \; next-window

# Shift-Left and Shift-Right switch windows without the prefix.  Programs
# lose those keys (some editors select text with them).
#bind -n S-Left  previous-window
#bind -n S-Right next-window

# ── Sessions ──────────────────────────────────────────────────────────────

# prefix S picks a session from a tree; prefix C-s creates one by name, or
# attaches when it exists; prefix R renames this one.
bind S choose-tree -Zs
bind C-s command-prompt -p "session name:" "new-session -A -s '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"

# ── Popups (tmux 3.2+) ────────────────────────────────────────────────────

# prefix g opens a shell in a floating window in this pane's directory;
# exit closes it.
bind g display-popup -E -d "#{pane_current_path}" -w 80% -h 80%

# prefix G opens lazygit in a floating window for this pane's repository.
# Needs: lazygit
#bind G display-popup -E -d "#{pane_current_path}" -w 90% -h 90% lazygit

# ── Other ─────────────────────────────────────────────────────────────────

# prefix C-l clears the screen and the pane's scrollback.
bind C-l send-keys C-l \; clear-history

# prefix C-p starts or stops logging this pane to ~/tmux.log.WINDOW-PANE.
bind C-p pipe-pane -o 'cat >>~/tmux.log.#I-#P' \; display "logging toggled"

# prefix m turns the mouse on or off (replaces mark-pane).
bind m set -g mouse \; display "mouse #{?mouse,on,off}"
