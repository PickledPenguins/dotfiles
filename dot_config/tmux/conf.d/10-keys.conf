# 10-keys.conf -- key bindings.
#
# Prefix stays C-b.  For C-a (screen habit) uncomment the three lines below;
# C-a C-a then sends a real C-a to the program in the pane.
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── panes ─────────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"   # split right, same directory
bind - split-window -v -c "#{pane_current_path}"   # split below
bind c new-window     -c "#{pane_current_path}"    # new window, same directory
bind h select-pane -L                              # vim-style movement ...
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5                         # ... and resizing (-r: repeatable)
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind x kill-pane                                   # no confirmation
bind X kill-window
bind z resize-pane -Z                              # zoom toggle (default, listed for discovery)
bind b break-pane -d                               # pane to its own window, stay here
bind S choose-tree -Zs                             # session picker
bind Tab last-window                               # toggle the two most recent windows
bind -n M-Left  previous-window                    # Alt-arrows without the prefix
bind -n M-Right next-window
bind -n M-Up    swap-window -t -1 \; previous-window   # move window left / right
bind -n M-Down  swap-window -t +1 \; next-window

# ── sessions ──────────────────────────────────────────────────────────────
bind C-s command-prompt -p "session name:" "new-session -A -s '%%'"   # create or attach
bind R command-prompt -I "#S" "rename-session '%%'"

# ── misc ──────────────────────────────────────────────────────────────────
bind C-l send-keys C-l \; clear-history            # clear screen and scrollback
bind C-p pipe-pane -o 'cat >>~/tmux.log.#I-#P' \; display "logging toggled"   # log this pane
bind m set -g mouse \; display "mouse #{?mouse,on,off}"
