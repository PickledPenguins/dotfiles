# 40-nested.conf -- tmux inside tmux (ssh to a host that runs its own).
#
# F12 turns the OUTER tmux off: its prefix and status line go away and every
# key reaches the inner one.  F12 again turns it back on.  The outer status
# line shows OFF while disabled.

bind -T root F12 \
  set prefix None \; \
  set key-table off \; \
  set status-style "bg=colour52,fg=colour250" \; \
  set status-left "#[fg=colour196,bold] OFF #[default]│ " \; \
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
  refresh-client -S

bind -T off F12 \
  set -u prefix \; \
  set -u key-table \; \
  set -u status-style \; \
  set -u status-left \; \
  refresh-client -S
