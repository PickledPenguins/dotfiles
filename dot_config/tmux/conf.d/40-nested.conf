# 40-nested.conf: tmux inside tmux, as when you ssh to a host that runs
# its own.
#
# Each setting has its description in the comment above it.  A setting with
# "#" directly in front of it is off: delete that "#" to turn it on, or add
# one to turn a setting off.  `dots options WORD` searches every file.
# For one machine only, put the line in ~/.tmux.conf.local instead.

# F12 switches the OUTER tmux off: its prefix and keys go away, every key
# reaches the inner one, and the outer status line shows OFF in red.  F12
# again switches it back on.
bind -T root F12 \
  set prefix None \; \
  set key-table off \; \
  set status-style "bg=colour52,fg=colour250" \; \
  set status-left "#[fg=colour196,bold] OFF #[default]│ " \; \
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
  refresh-client -S
bind -T off F12 \
  set -u prefix \; \
  set -u key-table \; \
  set -u status-style \; \
  set -u status-left \; \
  refresh-client -S

# The status line at the top when inside an ssh session, so the inner
# tmux's line and the outer one's do not sit together at the bottom.
#if-shell 'test -n "$SSH_CONNECTION"' 'set -g status-position top'
