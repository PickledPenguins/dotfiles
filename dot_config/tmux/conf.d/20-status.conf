# 20-status.conf -- the status line:
#
#   [ work ]  1:vim  2:make*  3:ssh          ⧉ 2  host  14:32
#
# Colors are 256-color numbers: colour235 background, colour250 text,
# colour114 the green accent.  Change the accent everywhere for a theme:
# colour33 blue, colour208 orange, colour141 purple, colour203 red
# (`for i in {0..255}; do printf '\e[38;5;%sm%s ' $i $i; done` shows them).
#
# Each setting has its description in the comment above it.  A setting with
# "#" directly in front of it is off: delete that "#" to turn it on, or add
# one to turn a setting off.  `dots options WORD` searches every file.
# For one machine only, put the line in ~/.tmux.conf.local instead.

# ── Placement ─────────────────────────────────────────────────────────────

# A status line at the bottom, window list at the left, redrawn every 5 s.
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# The status line at the top instead.
#set -g status-position top

# The window list in the middle.
#set -g status-justify centre

# ── Content ───────────────────────────────────────────────────────────────

# Colors of the line itself.
set -g status-style "bg=colour235,fg=colour250"

# Left: the session name in the accent color.
set -g status-left-length 30
set -g status-left "#[fg=colour114,bold] #S #[default]│ "

# Right: ⌨ while the prefix is pressed, the window count when more than
# one, the host, the time.
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=colour114]⌨ ,}#[fg=colour250]#{?#{==:#{session_windows},1},,⧉ #{session_windows}  }#h #[fg=colour244]│ %H:%M "

# Right side with the load average and the date too (Linux /proc).
#set -g status-right "#{?client_prefix,#[fg=colour114]⌨ ,}#[fg=colour250]#(cut -d' ' -f1-3 /proc/loadavg)  #h #[fg=colour244]│ %a %d %b %H:%M "

# Windows: number:name and flags (* current, - last, # activity, Z zoomed);
# the current one in the accent color; activity orange, bells red.
setw -g window-status-format " #I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format "#[fg=colour235,bg=colour114,bold] #I:#W #[default]"
setw -g window-status-activity-style "fg=colour214"
setw -g window-status-bell-style "fg=colour196,bold"

# ── Borders, messages, selection ──────────────────────────────────────────

# Pane borders grey, the active one in the accent color.
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour114"

# Each pane's number and program in its top border.
#set -g pane-border-status top
#set -g pane-border-format " #P: #{pane_current_command} "

# Messages and the copy-mode selection in the accent color.
set -g message-style "bg=colour114,fg=colour235"
set -g mode-style "bg=colour114,fg=colour235"
