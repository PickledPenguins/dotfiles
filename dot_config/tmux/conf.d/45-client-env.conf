# 45-client-env.conf: shells already running in tmux take DISPLAY,
# SSH_AUTH_SOCK and the rest of update-environment from the client typed
# on last, not only from the client that attached last.
#
# On attach tmux copies those names from the client into the session, and
# only panes made afterwards see them. With the setting below on, each
# attach, switch of session and change of the client typed on runs
# ~/.config/tmux/client-env, which sets that client's values in the
# session and writes them where shells read them; the matching setting in
# ~/.config/bash/rc.d/15-tmux-env.sh applies them in each shell.
#
# Each setting has its description in the comment above it. A setting with
# "#" directly in front of it is off: delete that "#" to turn it on, or add
# one to turn a setting off. `dots options WORD` searches every file.
# For one machine only, put the line in ~/.tmux.conf.local instead.

# With several clients on one session (laptop and desktop), the panes take
# the values of the client typed on last, so an X program opens on the
# screen in front of you and ssh uses that machine's agent; switching
# clients costs one run of client-env, about 10 ms. SSH_AUTH_SOCK becomes
# ~/.ssh/agent.sock, a link to that agent, which programs already running
# follow too. Needs: bash 4.3, /proc for values beyond the last attach,
# and 15-tmux-env.sh's setting for the running shells.
#set-hook -g client-session-changed[45] 'run-shell "~/.config/tmux/client-env #{q:socket_path} #{pid} #{client_pid} #{q:session_id}"'
#set-hook -g client-active[45] 'run-shell "~/.config/tmux/client-env #{q:socket_path} #{pid} #{client_pid} #{q:session_id}"'
