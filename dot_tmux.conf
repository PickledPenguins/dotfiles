# ~/.tmux.conf -- loader only.  Settings live in ~/.config/tmux/conf.d/,
# one concern per NN-name.conf, in number order.  tmux >= 3.0.
#
#   turn a module off:   rename NN-name.conf to NN-name.conf.off
#   machine-local:       ~/.tmux.conf.local, sourced last
#   reload:              prefix r
#
# tmux has no variables to use as knobs; each module documents the lines
# to change instead.

source-file -q ~/.config/tmux/conf.d/*.conf
source-file -q ~/.tmux.conf.local
