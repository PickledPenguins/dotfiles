# ~/.tmux.conf -- loader only.  Settings live in ~/.config/tmux/conf.d/.
# Turn a module off by renaming NN-name.conf to NN-name.conf.off; machine-local
# overrides go in ~/.tmux.conf.local (sourced last).  tmux >= 3.0 (glob source).

source-file -q ~/.config/tmux/conf.d/*.conf
source-file -q ~/.tmux.conf.local
