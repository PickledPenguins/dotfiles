# ~/.tmux.conf: loader only.  Settings live in ~/.config/tmux/conf.d/, one
# concern per NN-name.conf, read in number order.  tmux 3.2 or newer.
#
# Each setting has its description in the comment above it.  A setting with
# "#" directly in front of it is off: delete that "#" to turn it on, or add
# one to turn a setting off.  `dots options WORD` searches every file.
#
#   turn a module off:   rename NN-name.conf to NN-name.conf.off
#   this machine only:   ~/.tmux.conf.local, read last (any setting line)
#   reload:              prefix r
#
# tmux has no variables to use as knobs; change the lines themselves.

# Every module, in number order; .conf.off files are not matched.
source-file -q ~/.config/tmux/conf.d/*.conf

# This machine's overrides, last.
source-file -q ~/.tmux.conf.local
